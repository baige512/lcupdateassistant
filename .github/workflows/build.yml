name: Build LCUpdateAssistant

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Theos 签名需要 ldid；GitHub macOS runner 默认没装
      - name: Install ldid
        run: brew install ldid

      # Theos 自带 sdks 子模块（--recurse-submodules 已包含），不要重复 clone
      - name: Setup Theos
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git theos
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Build dylib
        run: |
          make clean
          make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: LCUpdateAssistant-dylib
          path: .theos/obj/**/*.dylib
          if-no-files-found: error
