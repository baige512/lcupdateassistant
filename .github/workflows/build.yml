name: Build LCUpdateAssistant

# 有代码 push 就自动编译；也能在 Actions 页面手动点 Run workflow
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: theos
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks

      - name: Build dylib
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          make clean
          make

      # 把编出来的 dylib 传成构建产物，直接在网页下载
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: LCUpdateAssistant-dylib
          path: .theos/obj/**/*.dylib
          if-no-files-found: error
