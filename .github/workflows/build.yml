name: Build LCUpdateAssistant

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不用第三方 theos-action（它 cd theos/sdks 会因新版 Theos 无此目录而失败）
      - name: Setup Theos
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git theos
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$GITHUB_WORKSPACE/theos/sdks"

      - name: Build dylib
        run: |
          make clean
          make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: LCUpdateAssistant-dylib
          path: .theos/obj/**/*.dylib
          if-no-files-found: error
